security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
            form_login:
                enable_csrf: true

        api:
            pattern: ^/api
            stateless: true
            custom_authenticators:
                - App\Security\ApiTokenAuthenticator
            json_login:
                check_path: tel_login
                failure_handler: App\Security\ApiAuthenticationFailureHandler

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: web_login
                check_path: web_login
                enable_csrf: true
            remember_me:
                secret: "%kernel.secret%"
                lifetime: 604800 # 7 jours (en secondes)
                path: /
                always_remember_me: true
            custom_authenticators:
                # - App\Security\GoogleAuthenticator
                #- App\Security\FacebookAuthenticator
                - App\Security\ManualAuthenticator
                # - App\Security\AppleAuthenticator
                - App\Security\ApiTokenAuthenticator
            logout:
                path: web_logout
            user_checker: App\Security\UserChecker
            switch_user: true
            #access_denied_handler: App\Security\AccessDeniedHandler

        secured_area:
            form_login:
                enable_csrf: true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    role_hierarchy:
        ROLE_DEVELOPPEUR: [ROLE_SUPER_ADMIN]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]
        ROLE_ADMIN:
            [ROLE_MAINTENANCE, ROLE_DISTRIBUTEUR, ROLE_ALLOWED_TO_SWITCH]
        ROLE_MAINTENANCE: [ROLE_USER]
        ROLE_DISTRIBUTEUR: [ROLE_PRO]
        ROLE_PRO: [ROLE_ERP]
        ROLE_ERP: [ROLE_USER]

    access_control:
        - { path: ^/dev, roles: PUBLIC_ACCESS }
        - { path: ^/api/1/open, roles: PUBLIC_ACCESS }
        - { path: ^/api/1, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/web/1, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
